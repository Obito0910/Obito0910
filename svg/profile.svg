<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Muhammad Imad Khan — whoami">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00FF9C"><animate attributeName="stop-color" values="#00FF9C;#22D3EE;#00FF9C" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#00FF9C;#22D3EE" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#00FF9C"><animate attributeName="stop-color" values="#00FF9C;#22D3EE;#00FF9C" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="skullGlow" cx="50%" cy="40%" r="65%">
    <stop offset="0%" stop-color="#00FF9C" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="winClip"><rect x="2" y="2" width="996" height="496" rx="16"/></clipPath>
  <clipPath id="leftClip"><rect x="30" y="68" width="300" height="392" rx="10"/></clipPath>
